name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches-ignore:
      - output
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Hemang2904
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%236C63FF&color_dots=%231a1b27,%232B2850,%23423D7A,%235953B5,%236C63FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
