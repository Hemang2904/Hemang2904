<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#1a1b27"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C63FF"/><stop offset="1" stop-color="#C9CBFF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .node{fill:#161b2e;stroke:#6C63FF;stroke-width:2}
      .title{fill:#FFFFFF;font-size:18px;font-weight:700;text-anchor:middle}
      .sub{fill:#A9A9FF;font-size:12px;text-anchor:middle}
      .link{fill:none;stroke:url(#flow);stroke-width:3;stroke-dasharray:14 10;animation:dash 1.6s linear infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .p2{animation-delay:1s}.p3{animation-delay:2s}
      .cap{fill:#C9D1D9;font-size:13px;text-anchor:middle}
      @keyframes dash{to{stroke-dashoffset:-48}}
      @keyframes pulse{0%,100%{stroke-opacity:.45;filter:none}50%{stroke-opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <text x="600" y="38" class="cap" font-size="15" fill="#8B949E">What ships at JewelBench, end to end</text>

  <g class="pulse">
    <rect x="60" y="80" width="230" height="110" rx="16" class="node"/>
    <text x="175" y="125" class="title">Photographs and briefs</text>
    <text x="175" y="150" class="sub">2 to 5 reference images</text>
    <text x="175" y="168" class="sub">5,000-character design briefs</text>
  </g>
  <path class="link" d="M290 135 C 340 135, 340 135, 390 135"/>

  <g class="pulse p2">
    <rect x="390" y="65" width="420" height="140" rx="16" class="node" filter="url(#glow)"/>
    <text x="600" y="100" class="title">Forge and the design co-pilot</text>
    <text x="600" y="125" class="sub">vision-based analysis, self-consistency sampling, outlier-robust aggregation</text>
    <text x="600" y="143" class="sub">deterministic weight estimator, evaluated against manufacturer ground truth</text>
    <text x="600" y="161" class="sub">four-mode wizard, fidelity check with retry, bulk variation planning</text>
    <text x="600" y="185" class="sub" fill="#6C63FF">about 10% median weight error, 106 records, cross-validated</text>
  </g>
  <path class="link" d="M810 135 C 860 135, 860 135, 910 135"/>

  <g class="pulse p3">
    <rect x="910" y="80" width="230" height="110" rx="16" class="node"/>
    <text x="1025" y="118" class="title">Manufacturable output</text>
    <text x="1025" y="143" class="sub">costed bill of materials</text>
    <text x="1025" y="161" class="sub">dimensioned spec sheet</text>
    <text x="1025" y="179" class="sub">3D assets for the bench</text>
  </g>

  <text x="600" y="238" class="cap">Python, FastAPI, Java WebFlux, React, PostgreSQL, Redis, Docker, GitHub Actions, AWS ECS, CloudFront, S3, SQS</text>
</svg>
